general {
    # Проверяем, запущен ли hyprlock, если нет — запускаем
    lock_cmd = pidof hyprlock || hyprlock
    # Заблокировать экран перед сном (закрытие крышки и т.д.)
    before_sleep_cmd = pidof hyprlock || hyprlock
    # Задержать сон до момента, пока экран реально не заблокирован
    # (ноут не должен уснуть, пока hyprlock ещё не нарисовался)
    inhibit_sleep = 2

    # Через 5 минут (300 секунд) ПОСЛЕ блокировки — выключить мониторы.
    # Метка (файл) отмечает заблокированное состояние сессии: hyprland сам
    # не ставит loginctl LockedHint при прямом запуске hyprlock, поэтому
    # опираемся на события блокировки/разблокировки hypridle.
    # Подпроцесс:
    #   - тикает каждые 300 секунд, пока сессия заблокирована;
    #   - выключает мониторы (dpms off), если они ещё горят;
    #   - после пробуждения мониторов (любой ввод) заново отсчитывает 300 секунд.
    # Срабатывает и после закрытия крышки: во время сна таймер замораживается
    # и доходит до конца после открытия крышки, т.е. экран погаснет
    # через ~5 минут после пробуждения (если сессия всё ещё заблокирована).
    # NB: в Hyprland 0.57+ hyprctl dispatch принимает lua-выражение
    # (старый синтаксис "dpms off all" больше не работает)
    on_lock_cmd = touch "$XDG_RUNTIME_DIR/hypridle-lock-marker"; ( while [ -e "$XDG_RUNTIME_DIR/hypridle-lock-marker" ]; do sleep 300; [ -e "$XDG_RUNTIME_DIR/hypridle-lock-marker" ] || break; for i in 1 2 3; do [ -e "$XDG_RUNTIME_DIR/hypridle-lock-marker" ] || break; hyprctl dispatch 'hl.dsp.dpms({ action = "off", monitor = "all" })' >/dev/null 2>&1; sleep 10; hyprctl -j monitors | jq -e 'all(.dpmsStatus == false)' >/dev/null 2>&1 && break; done; while hyprctl -j monitors | jq -e 'all(.dpmsStatus == false)' >/dev/null 2>&1; do sleep 10; [ -e "$XDG_RUNTIME_DIR/hypridle-lock-marker" ] || break; done; done ) &

    # При разблокировке убрать метку (остановит таймер) и гарантированно
    # включить мониторы (например, при разблокировке отпечатком, без ввода)
    on_unlock_cmd = rm -f "$XDG_RUNTIME_DIR/hypridle-lock-marker"; hyprctl dispatch 'hl.dsp.dpms({ action = "on", monitor = "all" })'
}

# Слушатель 1: Блокировка экрана через 5 минут (300 секунд) бездействия
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Слушатель 2: Переход в спящий режим через 1 час (3600 секунд) бездействия
# (ранее стояло timeout = 10 — похоже на тестовое значение)
listener {
    timeout = 3600
    on-timeout = systemctl suspend
}
