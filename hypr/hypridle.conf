general {
    # Проверяем, запущен ли hyprlock, если нет — запускаем (исправлена опечатка с оператором ||)
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = pidof hyprlock || hyprlock
}

# Слушатель 1: Блокировка экрана через 5 минут (300 секунд)
# Монитор при этом останется включенным и покажет ваш hyprlock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Слушатель 2: Переход в спящий режим через 1 час (3600 секунд)
listener {
    timeout = 10
    on-timeout = systemctl suspend
}

